name: Publish to Gradle Plugin Portal

# Runs when a GitHub release is published — not on tag push, so a tag
# created by mistake never triggers a publication.
#
# "published" is deliberate: it fires for stable releases and pre-releases
# alike, including those published from a draft. "prereleased" would miss
# every pre-release that started life as a draft.
on:
  release:
    types: [published]
  # Allows a manual run from the Actions tab if a publication needs replaying.
  workflow_dispatch:

# Write access is required by the last step, which uploads the built jars
# back onto the release.
permissions:
  contents: write

jobs:
  publish:
    # Pinned rather than ubuntu-latest, which GitHub silently moves to a new
    # release every couple of years.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Publish to the Gradle Plugin Portal
        run: ./gradlew publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Attach the built jars to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
